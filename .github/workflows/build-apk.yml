name: Сборка APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Установка зависимостей
        run: npm install

      - name: Leaflet в www/vendor
        run: npm run vendor

      - name: Android-проект
        run: |
          npx cap add android
          node scripts/patch-android.js
          npx cap sync android

      - name: Сборка debug-APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Переименовать
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Trasa.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Trasa-apk
          path: Trasa.apk

      - name: Опубликовать в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Trasa (сборка ${{ github.run_number }})
          files: Trasa.apk
          body: Скачайте Trasa.apk на телефон и установите.
